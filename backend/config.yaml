server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  cors_origins: ["*"]

database:
  influxdb_url: "http://influxdb:8086"
  token: "waterquality-dev-token-secret-2024"
  org: "water_quality_org"
  bucket: "water_quality_data"
  enable_fallback_storage: true  # Uses SQLite/in-memory cache when InfluxDB is offline
  fallback_db_path: "data/telemetry_fallback.db"

lora:
  frequency_mhz: 868.1
  spreading_factor: 10
  bandwidth_khz: 125
  coding_rate: "4/5"
  device_id: 1

thresholds:
  ph_min: 6.0
  ph_max: 9.0
  turbidity_max_ntu: 50.0
  do_min_mg_l: 4.0
  temp_max_c: 35.0
  ekf_nis_max: 13.28

simulator:
  auto_generate_mock_data: false  # Pure real-time hardware mode (receives real LoRa/HTTP packets)
  mock_interval_seconds: 5.0
